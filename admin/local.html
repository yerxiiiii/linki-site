<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linki 本地免登录测试</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #fbf7f0;
      --ink: #3d2b1f;
      --muted: #8a7866;
      --panel: #fff;
      --line: rgba(61, 43, 31, .12);
      --accent: #ff8e69;
      --accent-dark: #c45a3a;
      --ok: #5f8f78;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 201, 138, .35), transparent 28%),
        radial-gradient(circle at 88% 0%, rgba(127, 182, 154, .18), transparent 24%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }
    .card {
      width: min(100%, 560px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 28px 26px;
      box-shadow: 0 18px 48px rgba(61, 43, 31, .08);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(95, 143, 120, .12);
      color: var(--ok);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ok);
    }
    h1 {
      margin: 14px 0 8px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -.03em;
    }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
    .links {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }
    a.btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 52px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #fffaf2;
      color: inherit;
      text-decoration: none;
      font-weight: 750;
    }
    a.btn:hover { border-color: var(--accent); color: var(--accent-dark); }
    a.btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    a.btn.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
    .meta {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
      line-height: 1.55;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      background: #f2e9dc;
      padding: 1px 6px;
      border-radius: 6px;
      color: var(--ink);
    }
    .warn {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #fff1eb;
      color: var(--accent-dark);
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .warn.show { display: block; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">LOCAL · 免登录</div>
    <h1>Linki 本地测试入口</h1>
    <p>当前后台已关闭登录校验，可直接查看反馈留言、用户分析与归因数据。</p>

    <div class="links">
      <a class="btn primary" href="/">进入后台看板 →</a>
      <a class="btn" href="http://localhost:3000/" target="_blank" rel="noopener">打开官网首页</a>
      <a class="btn" href="http://localhost:3000/join.html" target="_blank" rel="noopener">打开候补名单表单</a>
    </div>

    <div class="meta">
      启动命令：<code>npm run local</code><br />
      本页地址：<code>http://localhost:3001/local</code>
    </div>
    <div class="warn" id="warn">未检测到免登录模式。请用 <code>npm run local</code> 启动后再打开本页。</div>
  </main>

  <script>
    (async () => {
      try {
        const res = await fetch("/api/session", { credentials: "same-origin" });
        const data = await res.json();
        if (!data.localOpen) document.getElementById("warn").classList.add("show");
      } catch {
        document.getElementById("warn").classList.add("show");
      }
    })();
  </script>
</body>
</html>
